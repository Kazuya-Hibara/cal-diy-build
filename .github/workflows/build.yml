name: build-cal-diy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "calcom/cal.diy commit SHA to build"
        required: true
        default: "b2c28a23ab5b53f2e3729657d23cccb50f64e18a"
      node_image:
        description: "Node base image replacing upstream's node:20 (EOL 2026-04-30)"
        required: true
        default: "node:22-bookworm"

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Checkout cal.diy at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ github.event.inputs.sha }}

      - name: Replace EOL node:20 base image
        env:
          NODE_IMAGE: ${{ github.event.inputs.node_image }}
        run: |
          sed -i -E "s#^FROM (--platform=[^ ]+ )?node:20( |$)#FROM \1${NODE_IMAGE}\2#" Dockerfile
          grep -nE '^FROM' Dockerfile
          ! grep -qE '^FROM .*node:20' Dockerfile

      - name: Set image tag
        id: tag
        run: |
          short=$(echo '${{ github.event.inputs.sha }}' | cut -c1-12)
          node=$(echo '${{ github.event.inputs.node_image }}' | sed -E 's/^node:([0-9]+).*/node\1/')
          echo "short=${short}-${node}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kazuya-hibara/cal-diy:${{ steps.tag.outputs.short }}
            ghcr.io/kazuya-hibara/cal-diy:latest
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/calendso
            CALCOM_TELEMETRY_DISABLED=1
            MAX_OLD_SPACE_SIZE=6144
