name: build-cal-diy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "calcom/cal.diy commit SHA to build"
        required: true
        default: "b2c28a23ab5b53f2e3729657d23cccb50f64e18a"

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Checkout cal.diy at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ github.event.inputs.sha }}

      - name: Set short sha tag
        id: tag
        run: echo "short=$(echo '${{ github.event.inputs.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kazuya-hibara/cal-diy:${{ steps.tag.outputs.short }}
            ghcr.io/kazuya-hibara/cal-diy:latest
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/calendso
            CALCOM_TELEMETRY_DISABLED=1
            MAX_OLD_SPACE_SIZE=6144
